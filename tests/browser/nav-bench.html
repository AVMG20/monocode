<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Navigation benchmark</title>
  </head>
  <body>
    <div id="root" style="height: 100vh"></div>
    <script>
      // Per-component attribution from the profiling build. Mirrors React
      // DevTools' "did this fiber render" logic: a subtree whose child pointer
      // is shared with the previous tree was not reconciled in this commit.
      (function () {
        const PerformedWork = 1;
        const stats = new Map();
        const commits = [];
        const watched = new Set(["Workspace", "SidebarComponent", "ProjectRail"]);
        window.benchFiber = {
          stats,
          commits,
          enabled: true,
          reset() {
            stats.clear();
            commits.length = 0;
          },
        };
        const names = new WeakMap();
        const rawName = (type) =>
          type?.displayName || type?.name || (type?.render && (type.render.displayName || type.render.name)) || null;
        // Minified library components keep 1-3 letter names; tag them with
        // a source snippet so they can be identified.
        const nameOf = (type) => {
          if (typeof type !== "function" && typeof type !== "object") return null;
          let name = names.get(type);
          if (name !== undefined) return name;
          name = rawName(type);
          if (name && name.length <= 3) {
            const fn = typeof type === "function" ? type : type.render || type.type;
            const src = String(fn).replace(/\s+/g, " ");
            name = `${name}{${src.slice(src.indexOf("{") + 1, src.indexOf("{") + 120)}}`;
          }
          names.set(type, name);
          return name;
        };
        window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = {
          supportsFiber: true,
          inject: () => 1,
          onCommitFiberUnmount() {},
          onPostCommitFiberRoot() {},
          onCommitFiberRoot(_id, root) {
            if (!window.benchFiber.enabled) return;
            const hits = {};
            const visit = (fiber, mounted) => {
              let children = 0;
              const reconciled =
                mounted || !fiber.alternate || fiber.child !== fiber.alternate.child;
              if (reconciled)
                for (let child = fiber.child; child; child = child.sibling) {
                  children += child.actualDuration || 0;
                  visit(child, mounted || !child.alternate);
                }
              if (typeof fiber.type === "string" || fiber.type == null) return;
              if (!(fiber.flags & PerformedWork) && !mounted) return;
              const name = nameOf(fiber.type);
              if (!name) return;
              const self = Math.max(0, (fiber.actualDuration || 0) - (reconciled ? children : 0));
              let entry = stats.get(name);
              if (!entry) stats.set(name, (entry = { renders: 0, self: 0 }));
              entry.renders++;
              entry.self += self;
              if (watched.has(name)) hits[name] = (hits[name] || 0) + 1;
            };
            const start = performance.now();
            visit(root.current, false);
            commits.push({
              at: start,
              duration: root.current.actualDuration || 0,
              walk: performance.now() - start,
              hits,
            });
          },
        };
        // Long tasks and long animation frames, with script attribution.
        window.benchLong = { tasks: [], frames: [] };
        try {
          new PerformanceObserver((list) => {
            for (const entry of list.getEntries())
              window.benchLong.tasks.push({ start: entry.startTime, duration: entry.duration });
          }).observe({ type: "longtask", buffered: true });
        } catch {}
        try {
          new PerformanceObserver((list) => {
            for (const entry of list.getEntries())
              window.benchLong.frames.push({
                start: entry.startTime,
                duration: entry.duration,
                blocking: entry.blockingDuration,
                styleAndLayoutStart: entry.styleAndLayoutStart,
                renderStart: entry.renderStart,
                scripts: (entry.scripts || []).map((script) => ({
                  duration: script.duration,
                  forcedStyleAndLayout: script.forcedStyleAndLayoutDuration,
                  invoker: script.invoker,
                  fn: script.sourceFunctionName,
                  url: (script.sourceURL || "").split("/").pop(),
                  pos: script.sourceCharPosition,
                })),
              });
          }).observe({ type: "long-animation-frame", buffered: true });
        } catch {}
      })();
    </script>
    <script type="module" src="./nav-bench.tsx"></script>
  </body>
</html>
